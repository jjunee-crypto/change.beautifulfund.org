<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변화의시나리오 · 공익활동지원사업</title>
<style>
  :root{
    --orange:#F4A100; --orange-d:#C8810A; --ink:#1A1A1A; --gray:#7F7F7F;
    --line:#E6E3DD; --bg:#FFFFFF; --bg2:#FBF8F2; --chip:#FDEBCF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  /* header */
  header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .bar{display:flex;align-items:center;gap:20px;height:64px;}
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:19px;cursor:pointer;white-space:nowrap;}
  .brand .dot{color:var(--orange);}
  .brand small{font-size:11px;color:var(--gray);font-weight:600;}
  nav.gnb{display:flex;gap:4px;margin-left:auto;}
  nav.gnb a{padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px;color:#333;cursor:pointer;white-space:nowrap;}
  nav.gnb a:hover{background:var(--bg2);}
  nav.gnb a.active{color:var(--orange-d);background:var(--chip);}
  .search{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;padding:0 10px;height:38px;}
  .search input{border:none;outline:none;font:inherit;font-size:14px;width:120px;background:transparent;}
  .btn{display:inline-block;background:var(--orange);color:#fff;font-weight:700;
    padding:9px 16px;border-radius:9px;cursor:pointer;border:none;font-size:15px;white-space:nowrap;}
  .btn:hover{background:var(--orange-d);}
  .btn.ghost{background:#fff;color:var(--orange-d);border:1.5px solid var(--orange);}
  nav.mnav{display:none;gap:4px;overflow-x:auto;padding:6px 16px 10px;border-top:1px solid var(--line);}
  nav.mnav a{padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;}
  nav.mnav a.active{color:var(--orange-d);background:var(--chip);}
  /* sections */
  main{min-height:60vh;}
  .page{padding:40px 0 64px;animation:f .3s ease;}
  @keyframes f{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  h1.ttl{font-size:30px;margin:0 0 6px;}
  .sub{color:var(--gray);margin:0 0 26px;}
  h2.sec{font-size:22px;margin:34px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--orange);display:inline-block;}
  h3{font-size:18px;margin:20px 0 8px;}
  .tabs{display:flex;gap:6px;margin:0 0 24px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tabs a{padding:11px 16px;font-size:16px;font-weight:600;color:#777;cursor:pointer;
    border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;}
  .tabs a.on{color:var(--orange-d);border-color:var(--orange);}
  /* hero */
  .hero{background:linear-gradient(180deg,var(--bg2),#fff);border:1px solid var(--line);
    border-radius:20px;padding:54px 44px;text-align:center;}
  .hero .kicker{color:var(--orange-d);font-weight:700;margin-bottom:12px;}
  .hero h1{font-size:40px;line-height:1.25;margin:0 0 14px;}
  .hero p{font-size:17px;color:#555;max-width:600px;margin:0 auto 26px;}
  .hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .grid.two{grid-template-columns:repeat(2,1fr);}
  .grid.four{grid-template-columns:repeat(4,1fr);}
  .card{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;
    cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;}
  .card:hover{border-color:var(--orange);box-shadow:0 6px 20px rgba(244,161,0,.10);transform:translateY(-2px);}
  .card.static{cursor:default;} .card.static:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{align-self:flex-start;background:var(--chip);color:var(--orange-d);font-size:12px;
    font-weight:700;padding:3px 9px;border-radius:20px;}
  .tag.gray{background:#F1EFEA;color:#666;}
  .card h4{margin:2px 0 0;font-size:17px;}
  .card p{margin:0;color:#666;font-size:14px;}
  .card .more{margin-top:auto;color:var(--orange-d);font-weight:700;font-size:14px;}
  .card .num{font-size:13px;font-weight:800;color:var(--orange-d);}
  .muted{color:var(--gray);font-size:14px;}
  /* filter */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;
    font-size:14px;cursor:pointer;font-weight:600;color:#555;font-family:inherit;}
  .filters button.on{background:var(--orange);color:#fff;border-color:var(--orange);}
  .empty{padding:40px;text-align:center;color:var(--gray);border:1px dashed var(--line);border-radius:14px;}
  /* detail */
  .back{color:var(--orange-d);font-weight:700;cursor:pointer;display:inline-block;margin-bottom:14px;font-size:14px;}
  .detail-hero{background:var(--chip);border-radius:16px;padding:30px;margin-bottom:10px;}
  .detail-hero .tag{background:#fff;}
  .detail-hero h1{margin:12px 0 8px;font-size:28px;line-height:1.3;}
  .detail-hero .one{margin:0;color:#7a5a00;font-weight:600;}
  .block{border-left:3px solid var(--orange);padding:4px 0 4px 18px;margin:28px 0;}
  .block .lbl{font-size:13px;font-weight:800;color:var(--orange-d);letter-spacing:.02em;}
  .block h3{margin:4px 0 8px;}
  .timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
  .timeline li{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;}
  .timeline b{color:var(--orange-d);}
  .change{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .change .big{font-size:24px;font-weight:800;color:var(--orange-d);}
  blockquote{margin:0;padding:18px 22px;background:var(--bg2);border-radius:12px;font-size:17px;}
  blockquote cite{display:block;margin-top:8px;font-size:13px;color:var(--gray);font-style:normal;}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .photo{aspect-ratio:4/3;background:#F1EFEA;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;margin:14px 0;font-size:14px;color:#666;}
  .kv dt{font-weight:700;color:#444;} .kv dd{margin:0;}
  .cta-band{background:var(--bg2);border:1px solid var(--line);border-radius:16px;
    padding:28px;text-align:center;margin-top:40px;}
  .cta-band h3{margin:0 0 6px;font-size:20px;}
  .cta-band p{margin:0 0 16px;color:#666;}
  .flow{display:grid;gap:12px;margin:18px 0;}
  .flow .step{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;}
  .flow .n{width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .flow .step h4{margin:0 0 4px;font-size:17px;}
  .flow .step p{margin:0;color:#555;}
  .flow .step.key{background:var(--chip);border-color:var(--orange);}
  table.tb{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;}
  table.tb th,table.tb td{border:1px solid var(--line);padding:10px 12px;text-align:left;}
  table.tb th{background:var(--bg2);}
  .note{background:#FFF7E8;border:1px dashed var(--orange);border-radius:10px;padding:12px 16px;
    font-size:13px;color:#7a5a00;margin:0 0 22px;}
  /* footer */
  footer.site{border-top:1px solid var(--line);background:var(--bg2);padding:34px 0;margin-top:20px;}
  footer.site .f{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between;}
  footer.site .slogan{font-weight:800;font-size:16px;}
  footer.site .hash{color:var(--orange-d);font-size:13px;font-weight:600;}
  footer.site small{color:var(--gray);display:block;margin-top:8px;}
  @media(max-width:900px){
    .grid,.grid.two,.grid.four,.change,.photos{grid-template-columns:1fr;}
    nav.gnb,.search{display:none;}
    nav.mnav{display:flex;}
    .hero{padding:36px 20px;} .hero h1{font-size:28px;}
    .wrap{padding:0 16px;}
    .brand small{display:none;}
    .bar .btn{margin-left:auto;}
  }
</style>
</head>

<header class="site">
  <div class="wrap bar">
    <div class="brand" onclick="go('home')">변화의시나리오<span class="dot">.</span><small>아름다운재단 공익활동지원사업</small></div>
    <nav class="gnb" id="gnb">

<script>
/* ---------- 태그 체계 (양식 C 초안) ---------- */
const TOPICS = ['기후·환경','지역공동체','평등·인권','돌봄·삶의 안전','청년·다음 세대','시민사회 힘 키우기'];
const OUTCOMES = ['제도·정책 변화','인식 변화','시민 참여 확대','새로운 해법','연대·네트워크','역량 강화'];

/* ---------- 사업미션 체계: 핵심목표 → 성과목표 (2026 체계정비 활동계획서 기준) ---------- */
const GOALS = [
  { name:'정체성', def:'재단의 정체성과 지향에 맞게 지원합니다.', items:[
    ['변화지향','우리 사회의 차별과 불평등 문제를 해소하기 위한 목적을 가진 활동을 발굴합니다.'],
    ['주체성','사회문제를 해결하기 위해 주도적으로 활동하는 주체를 지원합니다.'],
    ['연대성','사회의 모든 구성원들과 함께 집단적, 참여적으로 문제를 해결하는 활동을 지원합니다.']]},
  { name:'저변확대', def:'공익 의제와 주체가 발굴되고 확대될 수 있도록 지원합니다.', items:[

    ['접근성','사업소개, 공모절차 등을 쉽게 하여 지원신청의 진입장벽을 낮춥니다.'],
    ['포용성','사회적으로 민감한 의제에 대해서도 편견과 차별 없이 지원합니다.']]},
  { name:'역량강화', def:'활동 주체들의 자기성장이 가능하도록 지원합니다.', items:[
    ['목표달성','주체적인 목표 수립부터 수행, 평가와 피드백까지의 경험을 지원하여 목표달성을 통한 자기성장을 돕습니다.'],
    ['경험공유','협업 연계, 네트워크 모임, 결과공유회 등 활동 경험을 나눌 기회를 제공하여 혁신과 협력을 통한 성장을 지원합니다.'],
    ['지속가능성','단체가 독립성과 지속가능성을 갖추어 사회문제에 안정적으로 대응할 수 있도록 운영재원을 지원합니다.']]},
  { name:'연결구축', def:'공익 가치의 확산을 위해 공익활동과 기부를 연결합니다.', items:[
    ['아카이빙','재단의 공익활동지원 결과를 콘텐츠로 만들어 기록합니다.'],
    ['큐레이션','시민과 효과적으로 연결되도록 시의성 있거나 재단의 관점을 담은 주제를 기획하고 실행합니다.'],
    ['커뮤니케이션','시민의 참여를 이끌어 낼 수 있도록 상호 소통의 기회를 마련합니다.']]},
];

/* ---------- 지원사업 (예시 데이터) ---------- */
const projects = [
  { id:'scenario', type:'의제중심', name:'변화의시나리오 프로젝트지원사업', tagline:'변화를 위한 공익 의제를 발굴합니다',
    purpose:'우리 사회의 차별과 불평등을 해소하기 위한 공익 의제를 발굴하고, 문제를 해결할 수 있도록 지원합니다.', target:'공익 의제를 다루는 비영리단체·활동가' },

    purpose:'공익 의제를 널리 알리는 콘텐츠 제작을 지원하여 공익적 가치를 확산합니다.', target:'공익 콘텐츠를 만드는 단체·창작자' },
  { id:'incubating', type:'주체중심', name:'공익단체 인큐베이팅지원사업', tagline:'새로운 공익 주체의 성장을 돕습니다',
    purpose:'초기 공익단체가 조직 기반을 갖추고 자립할 수 있도록 지원합니다.', target:'설립 초기 공익단체' },
  { id:'youth', type:'주체중심', name:'청소년 공익활동지원사업', tagline:'청소년이 변화의 주체가 되도록',
    purpose:'청소년이 공익활동의 경험을 통해 사회변화의 주체로 성장하도록 지원합니다.', target:'공익활동에 참여하는 청소년·단체' },
  { id:'it', type:'토대중심', name:'공익단체 IT인프라지원사업', tagline:'활동의 디지털 기반을 세웁니다',
    purpose:'공익단체가 안정적으로 활동할 수 있도록 IT 인프라와 역량을 지원합니다.', target:'IT 기반이 필요한 공익단체' },
  { id:'activistnet', type:'토대중심', name:'공익활동가 네트워크지원사업', tagline:'활동가들이 함께 성장하도록',
    purpose:'공익활동가들이 경험을 나누고 협력할 수 있는 네트워크를 지원합니다.', target:'공익활동가·활동가 모임' },
  { id:'regionnet', type:'토대중심', name:'지역시민사회 네트워크지원사업', tagline:'지역 시민사회의 연대를 잇습니다',
    purpose:'지역 기반 시민사회 조직의 협력과 연대 활동을 지원합니다.', target:'지역 시민사회 단체·네트워크' },
  { id:'youngsafety', type:'토대중심', name:'청년활동가 안전망지원사업', tagline:'청년활동가의 지속가능성을 지킵니다',
    purpose:'청년활동가가 안정적으로 활동을 이어갈 수 있도록 안전망을 지원합니다.', target:'청년 공익활동가' },
];

/* ---------- 기록 (양식 A·B 구조의 예시 데이터) ----------
   kind: 기록(활동 기록·양식 A) | 후기(지원단체 후기·양식 B) | 리포트(성과평가 리포트) */
const records = [
  { id:'r1', kind:'후기', project:'youth', year:2026, topics:['청년·다음 세대'], outcomes:['역량 강화'],
    title:'"처음으로 내 이름으로 된 계약서를 썼어요"', one:'자립을 준비하는 청소년이 스스로 결정하는 경험을 쌓았습니다.',

    acts:[['3월','멘토와 1:1 결연'],['5월','주거·금융 실습 워크숍'],['8월','자립 계획 발표회']],
    quant:['참여 청소년','12명'], qual:'스스로 집을 구하고 계약한 청소년이 생겼습니다.',
    voice:['혼자가 아니라는 걸 알게 된 6개월이었어요.','참여 청소년'] },
  { id:'r2', kind:'기록', project:'activistnet', year:2026, topics:['평등·인권'], outcomes:['연대·네트워크'],

    body = `<p>사업 단위로 성과를 종합한 리포트입니다.</p>${listOrEmpty(records.filter(r=>r.kind==='리포트'))}`;
  } else if(sub==='glance'){
    body = `<p>한 해 동안 쌓인 기록을 핵심목표별로 정리해 연 1회 발행합니다.</p>
      <div class="note">시안 화면입니다. 수치는 아카이브 기록이 쌓인 뒤 집계해 채웁니다.</div>
      <div class="grid two">${GOALS.map(g=>`<div class="card static"><span class="tag">핵심목표</span><h4>${g.name}</h4>
        <p>${g.def}</p><div class="tags">${g.items.map(([n])=>`<span class="tag gray">${n} · [집계 예정]</span>`).join('')}</div></div>`).join('')}</div>`;
  } else if(arg){
    const c = curations.find(x=>x.id===arg); if(!c) return pageStory();
    const picks = c.picks.map(id=>records.find(r=>r.id===id)).filter(Boolean);
    body = `<span class="back" onclick="go('story/curation')">← 기획 큐레이션 목록</span>
      <div class="note">시안용 예시 기획입니다.</div>
      <div class="detail-hero"><span class="tag">기획 큐레이션 · ${c.season}</span><h1>${c.title}</h1></div>
      <div class="block"><div class="lbl">편집자의 글</div>${c.intro.map(t=>`<p>${t}</p>`).join('')}</div>
      <h2 class="sec">이 기획에 엮은 기록</h2>
      <div class="flow">${picks.map((r,i)=>`<div class="step" style="cursor:pointer" onclick="go('rec/${r.id}')"><div class="n">${i+1}</div><div><h4>${r.title}</h4><p>${r.one}</p></div></div>`).join('')}</div>`;
  } else {
    body = `<p>편집자가 시기에 맞는 주제나 재단의 관점으로 기록을 골라 엮은 기획입니다.</p>
      <div class="grid two">${curations.map(curCard).join('')}</div>`;
  }
  return `<section class="page">
    <h1 class="ttl">변화 이야기</h1><p class="sub">어떤 변화가 있었나요? 주목할 변화를 골라 전합니다.</p>
    ${tabs('story',[['curation','기획 큐레이션'],['report','성과평가 리포트'],['glance','한눈에 보는 변화']],sub)}
    ${body}${cta()}
  </section>`;
}

/* ---------- 변화 기록 (아카이브) ---------- */
const firstWith = (opts, f) => opts.find(o=>records.some(r=>r.kind!=='리포트'&&r[f].includes(o))) || opts[0];
const st = { by:'topic', topic:firstWith(TOPICS,'topics'), outcome:firstWith(OUTCOMES,'outcomes') };
function pageRecord(sub='records', arg, arg2){
  let body;
  if(sub==='tags'){
    if(arg==='topic'||arg==='outcome') st.by=arg;
    const isT = st.by==='topic', opts = isT?TOPICS:OUTCOMES;
    if(arg2) st[st.by]=decodeURIComponent(arg2);
    const cur = st[st.by];
    const list = records.filter(r=>r.kind!=='리포트' && (isT?r.topics:r.outcomes).includes(cur));
    body = `<div class="filters">
        <button class="${isT?'on':''}" onclick="go('record/tags/topic')">주제별</button>
        <button class="${!isT?'on':''}" onclick="go('record/tags/outcome')">성과유형별</button></div>
      <div class="filters">${opts.map(o=>`<button class="${o===cur?'on':''}" onclick="go('record/tags/${st.by}/${encodeURIComponent(o)}')">${o}</button>`).join('')}</div>
      ${listOrEmpty(list)}`;
  } else {
    const kind = sub==='reviews'?'후기':'기록';
    body = `<p>${kind==='기록'?'사업담당이 공통 양식으로 정리한 현장의 기록입니다.':'지원단체가 직접 쓴 활동 후기입니다.'}</p>
      ${listOrEmpty(records.filter(r=>r.kind===kind))}`;
  }
  return `<section class="page">
    <h1 class="ttl">변화 기록</h1><p class="sub">지원사업의 모든 기록을 모아 둔 아카이브입니다.</p>
    ${tabs('record',[['records','활동 기록'],['reviews','지원단체 후기'],['tags','주제·성과유형별 보기']],sub)}
    ${body}${cta()}
  </section>`;
}

/* ---------- 기록 상세 (양식 A 구조) ---------- */
function pageRec(id){
  const r = records.find(x=>x.id===id); if(!r) return pageHome();
  const related = records.filter(x=>x.id!==r.id && x.topics.some(t=>r.topics.includes(t))).slice(0,3);
  const label = r.kind==='기록'?'활동 기록':r.kind==='후기'?'지원단체 후기':'성과평가 리포트';
  const backTo = r.kind==='리포트'?['story/report','변화 이야기로']:[r.kind==='후기'?'record/reviews':'record/records','변화 기록으로'];
  return `<section class="page">
    <span class="back" onclick="go('${backTo[0]}')">← ${backTo[1]} 돌아가기</span>
    <div class="note">시안용 예시 콘텐츠입니다. 실제 기록은 아카이브 기록양식(양식 A)으로 작성된 내용이 들어갑니다.</div>
    <div class="detail-hero">
      <div class="tags"><span class="tag">${label}</span>${r.topics.map(t=>`<span class="tag">${t}</span>`).join('')}${r.outcomes.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <h1>${r.title}</h1><p class="one">${r.one}</p>
    </div>
    <dl class="kv"><dt>지원사업</dt><dd>${pj(r.project).name}</dd><dt>연도</dt><dd>${r.year}</dd></dl>
    <div class="block"><div class="lbl">문제정의</div><h3>무엇이 문제였나요?</h3><p>${r.problem}</p></div>
    <div class="block"><div class="lbl">활동</div><h3>무엇을 했나요?</h3>
      <ul class="timeline">${r.acts.map(([w,a])=>`<li><b>${w}</b><span>${a}</span></li>`).join('')}</ul></div>
    <div class="block"><div class="lbl">변화</div><h3>무엇이 달라졌나요?</h3>
      <div class="change">
        <div class="card static"><span class="muted">${r.quant[0]}</span><span class="big">${r.quant[1]}</span></div>
        <div class="card static"><span class="muted">정성 변화</span><p style="color:#333">${r.qual}</p></div>
      </div></div>
    <div class="block"><div class="lbl">지원단체의 목소리</div>
      <blockquote>“${r.voice[0]}”<cite>— ${r.voice[1]}</cite></blockquote></div>
    <div class="block"><div class="lbl">사진·자료</div>
      <div class="photos"><div class="photo">게시 동의된 사진</div><div class="photo">게시 동의된 사진</div><div class="photo">게시 동의된 사진</div></div></div>
    ${related.length?`<h2 class="sec">같은 주제의 다른 기록</h2><div class="grid">${related.map(recCard).join('')}</div>`:''}
    ${cta('이 변화에 함께해 주세요','당신의 기부가 다음 기록을 만듭니다.')}
  </section>`;
}

/* ---------- 통합 검색 ---------- */
function pageSearch(q=''){
  q = decodeURIComponent(q||'');
  const k = q.toLowerCase();
  const hit = q ? records.filter(r=>[r.title,r.one,r.problem,r.qual,...r.topics,...r.outcomes,pj(r.project).name].join(' ').toLowerCase().includes(k)) : [];
  return `<section class="page">
    <h1 class="ttl">통합 검색</h1>
    <form class="search" style="max-width:420px;margin:0 0 20px" onsubmit="event.preventDefault();go('search/'+encodeURIComponent(this.q.value.trim()))">
      <input name="q" value="${q.replace(/"/g,'&quot;')}" placeholder="검색어나 태그를 입력하세요" style="width:100%"></form>
    ${q?`<p class="muted">‘${q}’ 검색 결과 ${hit.length}건</p>${listOrEmpty(hit)}`:`<div class="filters">${[...TOPICS,...OUTCOMES].map(t=>`<button onclick="go('search/${encodeURIComponent(t)}')">${t}</button>`).join('')}</div>`}
  </section>`;
}

/* ---------- router ---------- */
const routes = { home:pageHome, promise:pagePromise, how:pageHow, story:pageStory, record:pageRecord, project:pageProject, rec:pageRec, search:pageSearch };
const menuOf = { promise:'promise', how:'how', project:'how', story:'story', record:'record', rec:null, search:'search/' };
function render(){
  const h = location.hash.replace('#','') || 'home';
  const [key,a,b] = h.split('/');
  const fn = routes[key] || pageHome;
  M.innerHTML = key==='story' ? fn(a||'curation', b) : key==='record' ? fn(a||'records', b, h.split('/')[3]) : fn(a||undefined);
  let active = menuOf[key];
  if(key==='rec'){ const r=records.find(x=>x.id===a); active = r&&r.kind==='리포트'?'story':'record'; }
  document.querySelectorAll('#gnb a, #mnav a').forEach(el=>el.classList.toggle('active', el.dataset.p===active));
  window.scrollTo(0,0);
}
function go(p){ location.hash = p; }
document.querySelectorAll('#gnb a, #mnav a').forEach(a=>a.onclick=()=>go(a.dataset.p));
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
